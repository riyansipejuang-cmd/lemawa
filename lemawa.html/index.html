<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrumen Monev Ormawa 2025</title>
    <style>
        .header-image {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-image img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        fieldset { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
        legend { font-weight: bold; padding: 0 10px; color: #333; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-image">
        <img src="lemawa.jpg" alt="Banner Sistem Monev UNIMUDA">
    </div>

    <h2>Instrumen Monev Ormawa 2025</h2>
    <form id="monevForm" method="POST">
        
        <!-- Data Diri dan Profil Ormawa -->
        <fieldset>
            <legend>Data Diri dan Profil Ormawa</legend>
            
            <label for="nama">Tuliskan Nama lengkap anda?</label>
            <input type="text" id="nama" name="nama" required>
            
            <label for="prodi">Dari prodi mana anda berasal?</label>
            <input type="text" id="prodi" name="prodi" required>

            <label for="semester">Semester berapa anda saat ini?</label>
            <input type="number" id="semester" name="semester" required>

            <label for="jabatan">Apa jabatan anda saat ini?</label>
            <select id="jabatan" name="jabatan">
                <option value="Ketua/Wakil Ketua">Ketua/Wakil Ketua</option>
                <option value="Sekretaris">Sekretaris</option>
                <option value="Bendahara">Bendahara</option>
            </select>

            <label for="whatsapp">Tuliskan nomor hp/wa anda!</label>
            <input type="text" id="whatsapp" name="whatsapp" required>

            <label for="jenis_org">Apa jenis organisasi anda?</label>
            <select id="jenis_org" name="jenis_org">
                <option value="Himaprodi">Himaprodi</option>
                <option value="UKM">UKM</option>
                <option value="Ortom">Ortom</option>
            </select>

            <label for="lama_menjabat">Sudah berapa lama anda menjabat?</label>
            <select id="lama_menjabat" name="lama_menjabat">
                <option value="< 1 Tahun">&lt; 1 Tahun</option>
                <option value="> 1 Tahun">&gt; 1 Tahun</option>
            </select>

            <label for="cara_pilih">Bagaimana Anda terpilih?</label>
            <select id="cara_pilih" name="cara_pilih">
                <option value="Penunjukan">Penunjukan</option>
                <option value="PLT">PLT</option>
                <option value="Musyawarah">Musyawarah</option>
            </select>

            <label for="sejarah">Dapatkah anda menceritakan sejarah singkat dari organisasi anda?</label>
            <textarea id="sejarah" name="sejarah" rows="3"></textarea>

            <label for="visi_misi">Apa visi, misi, dan tujuan dari organisasi anda?</label>
            <textarea id="visi_misi" name="visi_misi" rows="3"></textarea>

            <label for="sop">Apakah organisasi anda memiliki SOP dan AD-ART?</label>
            <select id="sop" name="sop">
                <option value="Iya">Iya</option>
                <option value="Tidak">Tidak</option>
                <option value="Belum Buat">Belum Buat</option>
                <option value="Draft">Draft</option>
            </select>
        </fieldset>

        <!-- Data Administrasi Ormawa -->
        <fieldset>
            <legend>Data Administrasi Ormawa (Upload Berkas)</legend>

            <label for="lpj">Upload LPJ Kegiatan 1 tahun terakhir:</label>
            <input type="file" id="lpj" name="lpj">

            <label for="sk_pengurus">Upload SK Pengurus Terbaru:</label>
            <input type="file" id="sk_pengurus" name="sk_pengurus">

            <label for="logo">Upload Logo Ormawa:</label>
            <input type="file" id="logo" name="logo">

            <label for="surat_keluar">Upload File Surat Keluar Terakhir:</label>
            <input type="file" id="surat_keluar" name="surat_keluar">
        </fieldset>

        <!-- Data Kepuasan Ormawa -->
        <fieldset>
            <legend>Data Kepuasan Ormawa</legend>
            <label for="untuk_lemawa">Untuk Lemawa:</label>
            <textarea id="untuk_lemawa" name="untuk_lemawa" rows="2"></textarea>

            <label for="untuk_warek3">Untuk Warek III:</label>
            <textarea id="untuk_warek3" name="untuk_warek3" rows="2"></textarea>
            
            <label for="untuk_fakultas">Fakultas:</label>
            <textarea id="untuk_fakultas" name="untuk_fakultas" rows="2"></textarea>
            
            <label for="untuk_prodi">Prodi:</label>
            <textarea id="untuk_prodi" name="untuk_prodi" rows="2"></textarea>
        </fieldset>
            
        <button type="submit" id="submitBtn">Kirim Formulir</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzbAWtY_jNHw1yGXaP32qys5HWC7PWWXA4RgRuy4Z_W9nIzhaAMsDIH6DL9WsRjk59D/exec';
    const form = document.getElementById('monevForm');

    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Sedang Mengirim & Mengunggah Berkas...';

        const fileInputLpj = document.getElementById('lpj');
        const fileInputSk = document.getElementById('sk_pengurus');
        const fileInputLogo = document.getElementById('logo');
        const fileInputSurat = document.getElementById('surat_keluar');

        function convertFileToBase64(fileInput) {
            return new Promise((resolve, reject) => {
                if (!fileInput.files || fileInput.files.length === 0) {
                    resolve({ base64: "", name: "", type: "" });
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = () => resolve({ base64: reader.result, name: file.name, type: file.type });
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        Promise.all([
            convertFileToBase64(fileInputLpj),
            convertFileToBase64(fileInputSk),
            convertFileToBase64(fileInputLogo),
            convertFileToBase64(fileInputSurat)
        ]).then(([lpjData, skData, logoData, suratData]) => {
            
            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => {
                if (key !== 'lpj' && key !== 'sk_pengurus' && key !== 'logo' && key !== 'surat_keluar') {
                    dataObj[key] = value;
                }
            });

            dataObj.lpj = lpjData.base64;
            dataObj.nama_lpj = lpjData.name;
            dataObj.type_lpj = lpjData.type;

            dataObj.sk_pengurus = skData.base64;
            dataObj.nama_sk = skData.name;
            dataObj.type_sk = skData.type;

            dataObj.logo = logoData.base64;
            dataObj.nama_logo = logoData.name;
            dataObj.type_logo = logoData.type;

            dataObj.surat_keluar = suratData.base64;
            dataObj.nama_surat = suratData.name;
            dataObj.type_surat = suratData.type;

            return fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(dataObj)
            });
        })
        .then(response => response.json())
        .then(result => {
            alert('Terima kasih! Formulir dan berkas berhasil dikirim.');
            form.reset();
            btn.disabled = false;
            btn.textContent = 'Kirim Formulir';
        })
        .catch(error => {
            console.error('Error!', error);
            alert('Terjadi kesalahan saat mengunggah berkas, silahkan coba lagi.');
            btn.disabled = false;
            btn.textContent = 'Kirim Formulir';
        });
    });
</script>
</body>
</html>
